[package]
name = "solana-os-registry"
version = "0.1.0"
description = "Solana OS On-Chain Registry: Zero-Knowledge Identity Commitments (ML-KEM-1024), Anti-Tamper Enclave Recovery Guard (vault.solos), and Freemium vs Pro Multi-Room Licensing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_os_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
