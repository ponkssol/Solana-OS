name: Windows installer

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: NSIS and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri NSIS and MSI installers
        run: npx tauri build --bundles nsis,msi

      - name: Stage installer filenames
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw "Installer outputs were not produced" }
          Copy-Item $nsis.FullName -Destination Solana-OS_1.0.0_x64-setup.exe
          Copy-Item $msi.FullName -Destination Solana-OS_1.0.0_x64_en-US.msi
          Get-Item Solana-OS_1.0.0_x64-setup.exe, Solana-OS_1.0.0_x64_en-US.msi | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: solana-os-windows-installers
          path: |
            Solana-OS_1.0.0_x64-setup.exe
            Solana-OS_1.0.0_x64_en-US.msi
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha.2
          name: Solana OS v1.0.0-alpha.2
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: true
          files: |
            Solana-OS_1.0.0_x64-setup.exe
            Solana-OS_1.0.0_x64_en-US.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
