name: Windows installer

on:
  push:
    branches:
      - main
      - "cursor/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: NSIS and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      # Updater artifacts need the signing key; forks and PRs without the secret still get plain installers.
      - name: Build Tauri NSIS and MSI installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --bundles nsis,msi --config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'
          } else {
            npx tauri build --bundles nsis,msi
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage installers and updater manifest
        id: stage
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw "Installer outputs were not produced" }
          $exeName = "Solana-OS_${version}_x64-setup.exe"
          $msiName = "Solana-OS_${version}_x64_en-US.msi"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $nsis.FullName -Destination "out/$exeName"
          Copy-Item $msi.FullName -Destination "out/$msiName"
          $sig = "$($nsis.FullName).sig"
          if (Test-Path $sig) {
            Copy-Item $sig -Destination "out/$exeName.sig"
            $manifest = [ordered]@{
              version = $version
              notes = "Solana OS $version"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                "windows-x86_64" = @{
                  signature = (Get-Content $sig -Raw).Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/v$version/$exeName"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM out/latest.json
            "updater=true" >> $env:GITHUB_OUTPUT
          }
          Get-ChildItem out | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: solana-os-windows-installers
          path: out/*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Solana OS v${{ steps.version.outputs.version }}
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A fixed tag gives the in-app updater one stable manifest URL across prereleases.
      - uses: softprops/action-gh-release@v2
        if: steps.stage.outputs.updater == 'true'
        with:
          tag_name: updater
          name: Updater manifest
          prerelease: true
          draft: false
          make_latest: false
          files: out/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
