name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rust:
    name: Rust and Anchor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check the Tauri host
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Test vault.solos
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib vault -- --test-threads=1
      - name: Check the Anchor program
        run: cargo check --manifest-path programs/solana-os-registry/Cargo.toml
