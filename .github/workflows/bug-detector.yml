name: Bug detector

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript and Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strict TypeScript check
        run: npx tsc --noEmit
      - name: Vite production build
        run: npx vite build

  rust:
    name: Rust clippy and Anchor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Tauri webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: cargo check (Tauri host)
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy (Tauri host)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo check (Anchor program)
        run: cargo check --manifest-path programs/solana-os-registry/Cargo.toml
      - name: cargo clippy (Anchor program)
        run: cargo clippy --manifest-path programs/solana-os-registry/Cargo.toml -- -D warnings
