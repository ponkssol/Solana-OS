name: Telegram notify

run-name: ${{ github.event_name == 'workflow_run' && format('tg-dedupe:{0}:{1}:{2}', github.event.workflow_run.id, github.event.workflow_run.run_attempt, github.event.workflow_run.conclusion) || github.event_name }}

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened, closed, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  release:
    types: [published]
  create:
  delete:
  workflow_run:
    workflows:
      - CI
      - Windows installer
      - Security audit
      - Bug detector
    types: [completed]
  workflow_dispatch:
    inputs:
      note:
        description: Catatan uji (opsional)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('tg-{0}-{1}-{2}', github.event.workflow_run.id, github.event.workflow_run.run_attempt, github.event.workflow_run.conclusion) || format('tg-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID || vars.TELEGRAM_TOPIC_ID }}
          TELEGRAM_DEDUPE_KEY: ${{ github.event_name == 'workflow_run' && format('tg-dedupe:{0}:{1}:{2}', github.event.workflow_run.id, github.event.workflow_run.run_attempt, github.event.workflow_run.conclusion) || '' }}
          TELEGRAM_TEST_NOTE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.note || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/telegram-notify.mjs
