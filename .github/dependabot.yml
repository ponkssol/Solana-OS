version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - security
      - dependencies

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - security
      - dependencies

  - package-ecosystem: cargo
    directory: "/programs/solana-os-registry"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - security
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - security
      - dependencies
